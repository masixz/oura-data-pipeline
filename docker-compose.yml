services:
  postgres:
    image: postgres:16
    container_name: oura_postgres
    environment:
      POSTGRES_USER: oura
      POSTGRES_PASSWORD: oura
      POSTGRES_DB: oura
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - oura_pgdata:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: oura_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - oura_metabase:/metabase-data
    depends_on:
      - postgres

volumes:
  oura_pgdata:
  oura_metabase:
