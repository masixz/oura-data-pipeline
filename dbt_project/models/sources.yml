version: 2

sources:
  - name: raw
    schema: raw
    description: Raw Oura API documents, one JSONB payload per document
    # ingested_at only moves when a document's payload actually changes, because
    # the upsert in ingestion/ingest.py is conditional. So freshness measures
    # whether new or revised data is arriving rather than merely whether the job
    # ran, which is the difference between a useful alert and a green light that
    # means nothing. Run with `make freshness`.
    loaded_at_field: ingested_at
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 7, period: day}
    tables:
      - name: oura_documents
        columns:
          - name: doc_id
            data_tests: [not_null]
          - name: payload
            data_tests: [not_null]
