name: oura_pipeline
version: "1.0"
profile: oura_pipeline

model-paths: ["models"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  oura_pipeline:
    staging:
      +schema: staging
      +materialized: view
    marts:
      # Tables, not views: these carry window functions over the full history,
      # and Metabase and the notebooks read them repeatedly.
      +schema: marts
      +materialized: table
