name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests and dbt build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oura
          POSTGRES_PASSWORD: oura
          POSTGRES_DB: oura
        # Published on 5433 so dbt_project/profiles.yml and .env.example work
        # here exactly as they do on a laptop. No CI-only config to drift.
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://oura:oura@localhost:5433/oura
      PGPASSWORD: oura

    steps:
      - uses: actions/checkout@v4

      # Dependencies allow 3.12 upwards (scipy and pandas set that floor);
      # local development runs 3.14. CI guards the lower bound.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Create the raw schema
        run: psql -h localhost -p 5433 -U oura -d oura -v ON_ERROR_STOP=1 -f db/init.sql

      - name: Load synthetic fixtures
        # Invented data, no real health records. Without rows the dbt schema
        # tests would pass vacuously instead of checking the JSONB extraction.
        run: psql -h localhost -p 5433 -U oura -d oura -v ON_ERROR_STOP=1 -f tests/fixtures/seed_raw.sql

      - name: Run tests
        run: pytest -q

      - name: Install dbt packages
        run: dbt deps --project-dir dbt_project --profiles-dir dbt_project

      - name: Build and test the dbt staging and marts layers
        run: dbt build --project-dir dbt_project --profiles-dir dbt_project

      - name: Confirm the models produced rows
        # Guards against the models silently returning nothing, which would
        # make every not_null and unique test trivially green.
        run: |
          count() { psql -h localhost -p 5433 -U oura -d oura -tAc "select count(*) from $1"; }
          echo "staging.daily            $(count staging.daily)"
          echo "marts.mart_sleep_daily   $(count marts.mart_sleep_daily)"
          echo "marts.mart_sleep_weekly  $(count marts.mart_sleep_weekly)"
          echo "marts.mart_workout_recovery $(count marts.mart_workout_recovery)"
          test "$(count staging.daily)" -eq 3
          test "$(count marts.mart_sleep_daily)" -eq 3
          test "$(count marts.mart_sleep_weekly)" -ge 1
          test "$(count marts.mart_workout_recovery)" -ge 1
